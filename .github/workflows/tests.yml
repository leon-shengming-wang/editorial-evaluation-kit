name: Validate evaluation kit
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python -m reviewbench data/cases.jsonl --html reports/index.html --json reports/summary.json
      - name: Test design-spec companion
        working-directory: tools/layout-preflight
        run: python -m unittest discover -s tests -v
